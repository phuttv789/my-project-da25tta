<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Đăng Ký</title>

    <link rel="stylesheet" href="../css/style3.css">
</head>

<body>
    <div class="container">
        <form id="register">

            <h2 id="title">Đăng Ký</h2>

            <div class="box">
                <label for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname" class="form-controls" required>
            </div>

            <div class="box">
                <label for="username">Tên đăng nhập:</label>
                <input type="text" id="username" name="username" class="form-controls" required>
            </div>

            <div class="box">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" class="form-controls" required>
            </div>

            <div class="box">
                <label for="password">Mật khẩu:</label>
                <input type="password" id="password" name="password" class="form-controls" required>
            </div>

            <div class="box">
                <label for="confirmPassword">Nhập lại mật khẩu:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-controls" required>
            </div>

            <div class="in">
                <input type="submit" value="Đăng Ký">
                <input type="reset" value="Hủy">
            </div>

            <p class="login-link">
                Đã có tài khoản?
                <a href="dangnhap.html">Đăng nhập</a>
            </p>

        </form>
    </div>
</body>
</html>
